name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

# 🔐 REQUIRED FOR AWS OIDC
permissions:
  id-token: write
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: ./node_modules/.bin/playwright install chromium

      - name: Run frontend tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: ./node_modules/.bin/playwright test

  docker-build:
    name: Build & Push Docker Images to AWS ECR
    runs-on: ubuntu-latest
    needs: frontend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔐 Assume AWS role via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::119042107482:role/github-actions-ecr-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t devops-backend:${{ github.sha }} ./backend
          docker tag devops-backend:${{ github.sha }} 119042107482.dkr.ecr.us-east-1.amazonaws.com/devops-backend:${{ github.sha }}
          docker push 119042107482.dkr.ecr.us-east-1.amazonaws.com/devops-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t devops-frontend:${{ github.sha }} ./frontend
          docker tag devops-frontend:${{ github.sha }} 119042107482.dkr.ecr.us-east-1.amazonaws.com/devops-frontend:${{ github.sha }}
          docker push 119042107482.dkr.ecr.us-east-1.amazonaws.com/devops-frontend:${{ github.sha }}
